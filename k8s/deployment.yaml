apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins-argocd-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jenkins-argocd-app
  template:
    metadata:
      labels:
        app: jenkins-argocd-app
    spec:
      containers:
        - name: nginx
          image: kamran1013/jenkins-argocd-eks-pipeline:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 80
